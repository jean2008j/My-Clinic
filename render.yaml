# Render Blueprint: one web service that serves the API and the built website.
services:
  - type: web
    name: my-clinic
    runtime: node
    plan: free
    # npm ci --include=dev: Render sets NODE_ENV=production, but the build needs TypeScript and Vite.
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build && npm --prefix server ci --include=dev && npm --prefix server run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste the Supabase Session pooler URI in the Render dashboard
      - key: DATABASE_SSL
        value: "true"
      - key: CLINIC_TZ
        value: Europe/Amsterdam
